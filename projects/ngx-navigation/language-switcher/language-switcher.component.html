@if (isInMenu) {
    <ngx-language-menu-items [items]="items()" />
} @else if (appearance() === 'menu') {
    <!-- named by the label and the current language, which it shows, so a voice command with what it shows hits it -->
    <button ui-button type="button" variant="text" [uiMenuTrigger]="menu">
        <ui-icon [icon]="icon" />
        @if (currentItem(); as current) {
            <!-- the space inside, Angular drops the ones between elements -->
            <span class="sr-only">{{ label() }}: </span><span [lang]="current.code">{{ current.label }}</span>
        } @else {
            {{ label() }}
        }
    </button>
    <ui-menu #menu>
        <ngx-language-menu-items [items]="items()" />
    </ui-menu>
} @else {
    <nav [attr.aria-label]="label()">
        <ul class="flex flex-wrap gap-1">
            @for (item of items(); track item.code) {
                <li>
                    <a
                        ui-link
                        appearance="nav"
                        [href]="item.href"
                        [attr.hreflang]="item.code"
                        [lang]="item.code"
                        [attr.aria-current]="item.isCurrent ? 'page' : null"
                    >
                        {{ item.label }}
                    </a>
                </li>
            }
        </ul>
    </nav>
}
