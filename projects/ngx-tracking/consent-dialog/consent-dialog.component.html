<!-- the dialog focuses its heading when it opens, instead of the first category: the user reads the text first, and
     the browser would show the focus ring of the category without any key being pressed. The heading is not
     interactive and not in the tab order, so it needs no visible focus. -->
<!-- eslint-disable-next-line angular/no-autofocus -- in a modal the browser moves the focus anyway, autofocus only says where -->
<h2 class="font-heading text-title outline-none" tabindex="-1" autofocus>{{ labels.title }}</h2>
@for (paragraph of config.paragraphs; track $index) {
    <p class="mt-3 text-body">{{ paragraph }}</p>
}
<ui-form class="mt-4 grid gap-4" (submit)="saveChoices()">
    <div>
        @for (category of categories(); track category.category) {
            <ngx-consent-category
                [category]="category"
                [showOnlyCategory]="config.showOnlyCategories"
                (categoryToggled)="toggleCategory(category)"
                (trackingToggled)="toggleTracking($event)"
            />
        }
    </div>
    <!-- allowing all and only the required ones look the same: refusing must be as easy as accepting. Equally wide, and
         stacked once they don't fit next to each other. -->
    <div class="grid gap-2 sm:grid-cols-3">
        <button ui-button type="button" (click)="allowAll()">{{ labels.allowAll }}</button>
        <button ui-button type="submit" variant="outlined">{{ labels.saveChoices }}</button>
        <button ui-button type="button" (click)="allowOnlyRequired()">{{ labels.onlyRequired }}</button>
    </div>
</ui-form>
<!-- new tabs keep the dialog and its choices, which the page behind it can't be used without -->
<p class="mt-4 flex flex-wrap justify-center gap-x-4 text-body-sm">
    <a class="text-primary underline" target="_blank" [href]="config.privacyUrl">{{ labels.privacy }}</a>
    <a class="text-primary underline" target="_blank" [href]="config.imprintUrl">{{ labels.imprint }}</a>
</p>
