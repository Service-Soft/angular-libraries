<!-- a new password: the browser's password manager offers to create one, and keeps it -->
<ui-input-string
    type="password"
    autocomplete="new-password"
    [label]="label()"
    [hint]="hint()"
    [required]="required()"
    [readonly]="readonly()"
    [minLength]="metadata().minLength"
    [maxLength]="metadata().maxLength"
    [pattern]="pattern()"
    [passwordStrength]="metadata().passwordStrength"
    [customValidation]="problemValidation()"
    [value]="value() ?? ''"
    [(showValidationError)]="showError"
    (valueChange)="changeText($event)"
/>
@if (hasConfirmation()) {
    <ui-input-string
        type="password"
        autocomplete="new-password"
        [label]="confirmationLabel()"
        [required]="confirmationRequired()"
        [customValidation]="validateConfirmation"
        [value]="confirmation()"
        [(showValidationError)]="showConfirmationError"
        (valueChange)="confirmation.set($event)"
    />
}
