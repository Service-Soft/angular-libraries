<ui-form class="grid gap-4" (submit)="accepted.emit(password())">
    <ui-input-string
        name="password"
        type="password"
        autocomplete="new-password"
        [label]="labels().password"
        [minLength]="minLength()"
        [(value)]="password"
    />
    <div class="flex flex-wrap gap-2">
        <button ui-button type="submit">{{ labels().accept }}</button>
        @if (declinable()) {
            <button ui-button type="button" variant="outlined" (click)="declined.emit()">{{ labels().decline }}</button>
        }
    </div>
</ui-form>
