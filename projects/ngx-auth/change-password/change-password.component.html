<h2 class="font-heading text-title text-on-surface">{{ labels.title }}</h2>
<ui-form class="mt-4 grid gap-4" (submit)="save()">
    <ui-input-string
        name="current-password"
        type="password"
        autocomplete="current-password"
        [label]="labels.currentPassword"
        [(value)]="currentPassword"
        [(showValidationError)]="currentPasswordErrorShown"
    />
    <ui-input-string
        name="new-password"
        type="password"
        autocomplete="new-password"
        [label]="labels.newPassword"
        [minLength]="config.newPasswordMinLength"
        [(value)]="newPassword"
        [(showValidationError)]="newPasswordErrorShown"
    />
    <div><button ui-button type="submit">{{ labels.save }}</button></div>
</ui-form>
<!-- always rendered, screen readers only announce changes of live regions that already exist. empty:hidden: it takes
     no space while nothing was refused -->
<div class="mt-4 text-body text-error empty:hidden" role="alert">
    @for (paragraph of errorParagraphs(); track $index) {
        <p>{{ paragraph }}</p>
    }
</div>
<p class="mt-4 text-body text-on-surface" role="status">{{ status() }}</p>
