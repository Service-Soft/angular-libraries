@if (otpRegistration(); as registration) {
    <p class="text-body text-on-surface">{{ labels.scanQrCode }}</p>
    @if (qrCode(); as code) {
        <!-- scheme-light: the tokens resolve to their light values, so the code stays dark on light, which every scanner
             reads, also in dark mode -->
        <svg
            class="mt-4 size-48 scheme-light"
            role="img"
            shape-rendering="crispEdges"
            [attr.viewBox]="'0 0 ' + code.size + ' ' + code.size"
            [attr.aria-label]="labels.qrCode"
        >
            <rect class="fill-surface" width="100%" height="100%" />
            <path class="fill-on-surface" [attr.d]="code.path" />
        </svg>
    }
    <p class="mt-4 text-body text-on-surface">{{ labels.secret }}</p>
    <p class="mt-1 font-code text-body text-on-surface wrap-anywhere">{{ registration.secret }}</p>
} @else if (recoveryCodes(); as codes) {
    <p class="text-body text-on-surface">{{ labels.saveRecoveryCodes }}</p>
    <ul class="mt-4 grid grid-cols-2 gap-2 font-code text-body text-on-surface">
        @for (code of codes; track code) {
            <li>{{ code }}</li>
        }
    </ul>
}
