<h1 class="font-heading text-headline text-on-surface">{{ labels.title }}</h1>
<p class="mt-2 text-body text-on-surface-variant">{{ labels.message }}</p>
<ui-form class="mt-6 grid gap-4" (submit)="send()">
    <ui-input-string name="email" type="email" autocomplete="username" [label]="labels.email" [(value)]="email" />
    <div class="flex flex-wrap items-center justify-between gap-2">
        <button ui-button type="submit">{{ labels.send }}</button>
        <!-- a link, which ends where the input ends, unlike a text button with its padding -->
        <a ui-link [routerLink]="loginRoute">{{ labels.backToLogin }}</a>
    </div>
</ui-form>
<!-- always rendered, screen readers only announce changes of live regions that already exist. empty:hidden: it takes
     no space while nothing was refused -->
<div class="mt-4 text-body text-error empty:hidden" role="alert">
    @for (paragraph of errorParagraphs(); track $index) {
        <p>{{ paragraph }}</p>
    }
</div>
<p class="mt-4 text-body text-on-surface" role="status">{{ status() }}</p>
