<h1 class="font-heading text-headline text-on-surface">{{ labels.title }}</h1>
@switch (state()) {
    @case ('valid') {
        <ui-form class="mt-6 grid gap-4" (submit)="save()">
            <ui-input-string
                name="new-password"
                type="password"
                autocomplete="new-password"
                [label]="labels.newPassword"
                [minLength]="config.newPasswordMinLength"
                [(value)]="newPassword"
            />
            <div><button ui-button type="submit">{{ labels.save }}</button></div>
        </ui-form>
    }
    @case ('invalid') {
        <p class="mt-4 text-body text-on-surface">{{ labels.invalid }}</p>
        <div class="mt-4"><a ui-button [routerLink]="config.requestPasswordResetRoute">{{ labels.requestNewLink }}</a></div>
    }
    @case ('changed') {
        <div class="mt-4"><a #loginLink ui-button [routerLink]="loginRoute">{{ labels.login }}</a></div>
    }
}
<!-- always rendered, screen readers only announce changes of live regions that already exist. empty:hidden: it takes
     no space while nothing was refused -->
<div class="mt-4 text-body text-error empty:hidden" role="alert">
    @for (paragraph of errorParagraphs(); track $index) {
        <p>{{ paragraph }}</p>
    }
</div>
<p class="mt-4 text-body text-on-surface" role="status">{{ status() }}</p>
