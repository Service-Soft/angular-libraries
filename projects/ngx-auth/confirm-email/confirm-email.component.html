<h1 class="font-heading text-headline text-on-surface">{{ labels.title }}</h1>
<!-- always rendered, screen readers only announce changes of live regions that already exist -->
<p class="mt-2 text-body text-on-surface empty:hidden" role="status">{{ message() }}</p>
<div class="mt-2 text-body text-error empty:hidden" role="alert">
    @for (paragraph of errorParagraphs(); track $index) {
        <p>{{ paragraph }}</p>
    }
</div>
<div class="mt-6"><a ui-button [routerLink]="next().route">{{ next().label }}</a></div>
