<h2 class="font-heading text-title">{{ labels.title }}</h2>
@if (offlineService.offline()) {
    <p class="mt-3 text-body text-on-surface-variant">{{ labels.offline }}</p>
}
<ul
    #list
    class="
        mt-4 divide-y divide-outline-variant rounded-input border border-outline-variant
        focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary
    "
    [attr.tabindex]="listFocusable() ? -1 : undefined"
    (blur)="listFocusable.set(false)"
>
    @for (item of requests(); track item.request.id) {
        <li class="flex items-center gap-2 py-2 ps-4 pe-2">
            <div class="min-w-0 grow" [id]="item.descriptionId">
                <p class="text-label text-on-surface-variant">{{ item.methodLabel }}</p>
                <!-- wrap-anywhere: urls have no spaces to wrap at on a narrow screen -->
                <p class="text-body wrap-anywhere">{{ item.request.displayValue }}</p>
            </div>
            <button
                ui-button
                type="button"
                variant="text"
                iconOnly
                [attr.aria-label]="labels.sync"
                [attr.aria-describedby]="item.descriptionId"
                [disabled]="!item.canSync"
                (click)="sync(item.request)"
            >
                <ui-icon [icon]="faCloudArrowUp" />
            </button>
            <button
                ui-button
                type="button"
                variant="text"
                color="error"
                iconOnly
                [attr.aria-label]="labels.discard"
                [attr.aria-describedby]="item.descriptionId"
                (click)="discard(item.request)"
            >
                <ui-icon [icon]="faTrashCan" />
            </button>
        </li>
    }
</ul>
<p class="mt-3 text-body" role="status">{{ status() }}</p>
<div class="mt-6 flex flex-wrap justify-end gap-2">
    <button ui-button type="button" variant="text" (click)="dialogRef.close()">{{ labels.close }}</button>
    <button ui-button type="button" variant="outlined" color="error" (click)="discardAll()">{{ labels.discardAll }}</button>
    <button ui-button type="button" [disabled]="offlineService.offline()" (click)="syncAll()">{{ labels.syncAll }}</button>
</div>
