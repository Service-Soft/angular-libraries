@if (selectable()) {
    <td role="cell" class="w-10 px-3 py-2 align-middle max-sm:block max-sm:px-0 max-sm:pb-2">
        <!-- named together with the first value of the row, which says which row it selects -->
        <input
            type="checkbox"
            [class]="checkboxClasses"
            [checked]="selected()"
            [attr.aria-label]="selectLabel()"
            [attr.aria-describedby]="valueId()"
            (change)="toggled.emit()"
        />
    </td>
}
@for (column of columns(); track column.key; let first = $first) {
    <td ui-table-body-cell [column]="column" [row]="row()" [opens]="first && opens()" [valueId]="first ? valueId() : undefined" (opened)="opened.emit()"></td>
}
@if (actions(); as actions) {
    <td role="cell" class="px-3 py-2 text-end align-middle max-sm:block max-sm:px-0 max-sm:pt-2 max-sm:text-start">
        <ng-container [ngTemplateOutlet]="actions" [ngTemplateOutletContext]="{ $implicit: row() }" />
    </td>
}
