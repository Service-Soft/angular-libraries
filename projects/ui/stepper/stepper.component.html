@if (isVertical()) {
    <ol class="grid" [attr.aria-label]="label()">
        @for (view of views(); track $index) {
            <!-- the column of the markers is as wide as one, the content starts where the names do. The line runs down
                 to the next step, the last one has none. -->
            <li class="grid grid-cols-[2rem_1fr] gap-x-3" [attr.aria-current]="view.state === 'current' ? 'step' : null">
                <div class="col-span-2 py-1">
                    <ui-stepper-header
                        showsHeading
                        [step]="view"
                        [headingLevel]="headingLevel()"
                        [headingClasses]="headingClasses()"
                        [buttonClasses]="headerButtonClasses()"
                        [doneLabel]="doneLabel"
                        (chosen)="goTo(view.index)"
                    />
                </div>
                <span aria-hidden="true" [class]="view.connectorClasses"></span>
                <div class="pb-4">
                    <ui-stepper-panel
                        [step]="view"
                        [headingLevel]="headingLevel()"
                        [headingClasses]="headingClasses()"
                        [backLabel]="backLabel()"
                        [nextLabel]="nextLabel()"
                        [finishLabel]="finishLabel()"
                        [busy]="isChecking()"
                        [busyLabel]="busyLabel"
                        (next)="next()"
                        (back)="back()"
                    />
                </div>
            </li>
        }
    </ol>
} @else {
    <!-- hidden where the row doesn't fit, where the progress below says the same -->
    <ol class="mb-6 hidden items-center gap-3 @2xl:flex" [attr.aria-label]="label()">
        @for (view of views(); track $index) {
            <li class="flex min-w-0 items-center gap-3 not-last:flex-1" [attr.aria-current]="view.state === 'current' ? 'step' : null">
                <ui-stepper-header
                    [step]="view"
                    [headingLevel]="headingLevel()"
                    [headingClasses]="headingClasses()"
                    [buttonClasses]="headerButtonClasses()"
                    [doneLabel]="doneLabel"
                    (chosen)="goTo(view.index)"
                />
                <span aria-hidden="true" [class]="view.connectorClasses"></span>
            </li>
        }
    </ol>
    <ui-stepper-progress class="mb-4 @2xl:hidden" [label]="progressLabel()" [segments]="progressSegments()" />
    @for (view of views(); track $index) {
        <ui-stepper-panel
            showsHeading
            [step]="view"
            [headingLevel]="headingLevel()"
            [headingClasses]="headingClasses()"
            [backLabel]="backLabel()"
            [nextLabel]="nextLabel()"
            [finishLabel]="finishLabel()"
            [busy]="isChecking()"
            [busyLabel]="busyLabel"
            (next)="next()"
            (back)="back()"
        />
    }
}
