@if (file().previewUrl; as previewUrl) {
    <!-- the name next to it says what it is. NgOptimizedImage refuses the blob and data urls a preview of a chosen file
         has -->
    <!-- eslint-disable-next-line angular/prefer-ngsrc -->
    <img class="size-6 shrink-0 rounded-sm object-cover" alt="" [src]="previewUrl" />
} @else {
    <ui-icon class="shrink-0 text-on-surface-variant" [icon]="fileIcon" />
}
<span class="min-w-0 truncate text-on-surface" [id]="file().nameId">{{ file().name }}</span>
@if (file().size) {
    <span class="shrink-0 text-body-sm text-on-surface-variant">{{ file().size }}</span>
}
