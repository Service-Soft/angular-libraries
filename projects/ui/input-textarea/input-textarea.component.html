<ui-input-field fill [field]="this">
    <!-- writing the same value doesn't move the cursor, so [value] can follow every keystroke -->
    <textarea
        #nativeInput
        [class]="inputClasses()"
        [id]="inputId()"
        [attr.autofocus]="autofocus() ? '' : null"
        [value]="value()"
        [rows]="rows()"
        [required]="required()"
        [disabled]="disabled()"
        [readOnly]="readonly()"
        [attr.minlength]="minLength() ?? null"
        [attr.maxlength]="maxLength() ?? null"
        [attr.name]="name() ?? null"
        [attr.placeholder]="placeholder() ?? null"
        [attr.autocomplete]="autocomplete() ?? null"
        [attr.aria-invalid]="errorMessage() ? 'true' : null"
        [attr.aria-describedby]="describedBy() ?? null"
        (input)="value.set(nativeInput.value)"
        (blur)="showValidationError.set(true)"
        (invalid)="showInsteadOfPopup($event)"
    ></textarea>
</ui-input-field>
