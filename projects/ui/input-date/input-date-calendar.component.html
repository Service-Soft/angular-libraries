<div [class]="headerClasses()">
    @if (view() === 'days') {
        <button
            ui-button
            type="button"
            variant="text"
            size="sm"
            iconOnly
            [disabled]="previousMonthDisabled()"
            [attr.aria-label]="previousMonthLabel"
            (click)="showMonth(-1)"
        >
            <ui-icon class="rtl:-scale-x-100" [icon]="previousMonthIcon" />
        </button>
    }
    <!-- expanded while the years or months show instead of the days, which the button switches back to. The month is a
         live region, so screen readers announce the month the buttons switched to. -->
    <button
        type="button"
        [class]="headerButtonClasses"
        [attr.aria-label]="headerButtonLabel()"
        [attr.aria-expanded]="view() !== 'days'"
        (click)="toggleYears()"
    >
        <span aria-live="polite" [id]="monthId">{{ monthLabel() }}</span>
        <ui-icon [icon]="headerIcon()" />
    </button>
    @if (view() === 'days') {
        <button
            ui-button
            type="button"
            variant="text"
            size="sm"
            iconOnly
            [disabled]="nextMonthDisabled()"
            [attr.aria-label]="nextMonthLabel"
            (click)="showMonth(1)"
        >
            <ui-icon class="rtl:-scale-x-100" [icon]="nextMonthIcon" />
        </button>
    }
</div>
<!-- the popover has no padding, so the header reaches its edges, and the grids get theirs here -->
<div class="px-3 pt-2 pb-3">
    <!-- every grid moves with the arrow keys and selects with Enter, Space or a click, which chooses what it shows.
         Disabled cells can still be focused, so the keyboard doesn't jump over them. The end of a row goes on to the
         start of the next one, colWrap is what the grid applies to the arrows left and right. -->
    @switch (view()) {
        @case ('days') {
            <ui-input-date-calendar-days
                [weeks]="weeks()"
                [weekdays]="weekdays"
                [month]="shownMonth()"
                [labelledBy]="monthId"
                (chosen)="chosen.emit($event)"
            />
        }
        @case ('years') {
            <!-- as high as the days, and scrolled to the shown year by focusing it. The padding keeps the focus outline
                 of the cells at the edges inside of what scrolls. -->
            <div class="max-h-68 overflow-y-auto p-1">
                <ui-input-date-calendar-options [options]="years()" [label]="chooseYearLabel" (chosen)="chooseYear($event)" />
            </div>
        }
        @case ('months') {
            <!-- as high as the days -->
            <ui-input-date-calendar-options fullHeight [options]="months()" [label]="yearLabel()" (chosen)="chooseMonth($event)" />
        }
    }
</div>
