<section [class]="classes()" [attr.aria-label]="label()">
    @if (icon(); as icon) {
        <!-- decorative, the label names the ticker -->
        <span class="flex shrink-0 text-on-surface-variant [&_svg]:size-[1.25em]"><ui-icon [icon]="icon" /></span>
    }
    <!-- the hidden overflow cuts the headlines off at the edges of the ticker while they move -->
    <div
        #viewport
        class="min-w-0 grow overflow-hidden"
        (focusin)="onFocusIn($event)"
        (focusout)="onFocusOut($event)"
        (mouseenter)="hovered.set(true)"
        (mouseleave)="hovered.set(false)"
    >
        <ul #track [class]="trackClasses()" [style.animation-duration.s]="duration()" [style.animation-play-state]="playState()">
            <ng-content />
        </ul>
    </div>
    <!-- moving content needs a way to stop it (WCAG 2.2.2). With reduced motion nothing moves, so there is nothing to
         stop. -->
    <span class="flex shrink-0 motion-reduce:hidden">
        <button
            ui-button
            type="button"
            variant="text"
            size="sm"
            iconOnly
            [attr.aria-label]="paused() ? labels.playLabel : labels.pauseLabel"
            (click)="togglePaused()"
        >
            <ui-icon [icon]="toggleIcon()" />
        </button>
    </span>
    <ng-content select="ui-news-ticker-actions" />
</section>
