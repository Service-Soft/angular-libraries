<h2 class="font-heading text-title">{{ data.title }}</h2>
@for (paragraph of data.paragraphs; track $index) {
    <p class="mt-3 text-body">{{ paragraph }}</p>
}
<!-- cancel comes first: the dialog focuses its first button, so pressing enter right away never confirms -->
<div class="mt-6 flex flex-wrap justify-end gap-2">
    <button ui-button type="button" variant="text" (click)="dialogRef.close(false)">
        {{ data.cancelButtonLabel }}
    </button>
    <button ui-button type="button" [color]="data.confirmButtonColor ?? 'primary'" (click)="dialogRef.close(true)">
        {{ data.confirmButtonLabel }}
    </button>
</div>
