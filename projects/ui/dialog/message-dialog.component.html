<h2 class="font-heading text-title">{{ data.title }}</h2>
@for (paragraph of data.paragraphs; track $index) {
    <!-- wrap-anywhere: messages of servers can hold long words without spaces, like ids and urls -->
    <p class="mt-3 text-body wrap-anywhere">{{ paragraph }}</p>
}
<div class="mt-6 flex justify-end">
    <button ui-button type="button" (click)="dialogRef.close()">{{ data.closeButtonLabel }}</button>
</div>
