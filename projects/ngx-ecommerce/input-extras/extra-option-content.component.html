<!-- a wrapping row: on a narrow card the price and the control move below the title instead of squeezing it -->
<span class="flex flex-wrap items-center gap-x-4 gap-y-2 p-4">
    <span class="flex min-w-0 grow basis-48 items-start gap-3">
        <ng-content select="[control-start]" />
        @if (card().option.image; as image) {
            <!-- decorative, the title says what it is. w-16 and h-auto keep the ratio of its width and height -->
            <img class="block h-auto w-16 shrink-0 rounded-sm" alt="" [ngSrc]="image.url" [width]="image.width" [height]="image.height" />
        } @else if (card().option.icon; as icon) {
            <!-- decorative, the title says what it is -->
            <span class="flex min-h-6 items-center text-on-surface-variant [&_svg]:size-5"><ui-icon [icon]="icon" /></span>
        }
        <span class="grid min-w-0 gap-1">
            <span class="text-label-lg" [id]="card().titleId">{{ card().option.label }}</span>
            @if (card().option.description; as description) {
                <span class="text-body-sm text-on-surface-variant" [id]="card().descriptionId">{{ description }}</span>
            }
        </span>
    </span>
    <span class="flex items-center gap-4">
        <!-- &ngsp; keeps the space between amount and unit, which angular removes between elements otherwise, so screen
             readers don't run them into each other -->
        <span class="text-end" [id]="card().priceId">
            <span class="block text-label-lg">{{ card().price }}</span>&ngsp;
            <span class="block text-body-sm text-on-surface-variant">{{ card().unit }}</span>
        </span>
        <ng-content select="[control-end]" />
    </span>
    <ng-content />
</span>
